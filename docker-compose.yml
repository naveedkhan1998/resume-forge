services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resume_builder_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumebuilder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resumebuilder}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional backend container (for full Docker dev or deployment)
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: resume_builder_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-resumebuilder}
      - OLLAMA_BASE_URL=${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      - SYSTEM_LLM_PROVIDER=${SYSTEM_LLM_PROVIDER:-pydantic_gateway}
      - SYSTEM_LLM_BASE_URL=${SYSTEM_LLM_BASE_URL:-https://gateway.pydantic.dev/v1}
      - SYSTEM_LLM_API_KEY=${SYSTEM_LLM_API_KEY:-}
      - SYSTEM_LLM_MODEL=${SYSTEM_LLM_MODEL:-qwen3.5:9b}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
    volumes:
      - ./apps/api:/app/apps/api
      - ./media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python apps/api/manage.py runserver 0.0.0.0:8000
    profiles: ["full"]

volumes:
  pgdata:
